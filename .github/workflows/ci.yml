name: build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # FetchContent clones six dependencies on a cold cache; keeping _deps
      # between runs turns a five minute configure into seconds. Keyed on the
      # files that pin the versions, so a bump invalidates it.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/msvc/_deps
          key: deps-windows-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Glad.cmake') }}

      - name: Configure
        run: cmake --preset msvc

      - name: Build
        run: cmake --build --preset msvc-release

      - name: Test
        run: ctest --preset msvc-release

  linux:
    name: Linux / GCC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GLFW needs the X11 development headers to configure, even though
      # nothing here opens a window.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build python3-venv libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/ninja/_deps
          key: deps-linux-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Glad.cmake') }}

      - name: Configure
        run: cmake --preset ninja

      - name: Build
        run: cmake --build --preset ninja

      # The test binary links only the computational stages -- no window, no GL
      # context -- so the whole suite runs on a headless runner.
      #
      # Except the golden hashes: those pin float-derived voxel indices, and
      # they were generated with MSVC. Whether GCC agrees bit for bit is an
      # open question rather than something to assume, so they are excluded
      # here instead of being allowed to fail.
      - name: Test
        run: ctest --preset ninja -E "presets produce byte-identical output"
