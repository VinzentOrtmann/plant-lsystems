name: build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every step tees its output to a log and, on failure, appends the tail to the
# job summary. Raw run logs need an authenticated download; a summary does not,
# so a failure stays diagnosable from the outside.
jobs:
  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # FetchContent downloads six archives on a cold cache; keeping _deps
      # between runs turns a slow configure into a fast one. Keyed on the files
      # that pin the versions, so a bump invalidates it.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/ci/_deps
          key: deps-windows-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Glad.cmake') }}

      - name: Tool versions
        run: |
          cmake --version
          python --version || echo "no python"
          python3 --version || echo "no python3"

      - name: Configure
        run: |
          set -o pipefail
          cmake --preset ci 2>&1 | tee configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset ci 2>&1 | tee build.log

      - name: Test
        run: |
          set -o pipefail
          ctest --preset ci 2>&1 | tee test.log

      - name: Report failure
        if: failure()
        run: |
          for f in configure.log build.log test.log; do
            [ -f "$f" ] || continue
            {
              echo "## Windows: tail of $f"
              echo '```'
              tail -n 150 "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Also as an annotation: unlike a summary, that is readable through
            # the API without an authenticated log download.
            esc=$(tail -n 40 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | sed -z 's/\n/%0A/g')
            echo "::error title=windows-${f}::${esc}"
          done

  linux:
    name: Linux / GCC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # GLFW needs development headers for both display stacks to configure,
      # even though nothing here opens a window. As of 3.4 it builds Wayland
      # support by default, so wayland-scanner and the protocol definitions are
      # required too -- omitting them fails the configure outright.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build python3-venv libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/ninja/_deps
          key: deps-linux-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Glad.cmake') }}

      - name: Tool versions
        run: |
          cmake --version
          gcc --version | head -1
          python3 --version

      - name: Configure
        run: |
          set -o pipefail
          cmake --preset ninja 2>&1 | tee configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset ninja 2>&1 | tee build.log

      # The test binary links only the computational stages -- no window, no GL
      # context -- so the whole suite runs on a headless runner.
      #
      # Except the golden hashes: those pin float-derived voxel indices, and
      # they were generated with MSVC. Whether GCC agrees bit for bit is an
      # open question rather than something to assume, so they are excluded
      # here instead of being allowed to fail.
      - name: Test
        run: |
          set -o pipefail
          ctest --preset ninja -E "presets produce byte-identical output" 2>&1 | tee test.log

      - name: Report failure
        if: failure()
        run: |
          for f in configure.log build.log test.log; do
            [ -f "$f" ] || continue
            {
              echo "## Linux: tail of $f"
              echo '```'
              tail -n 150 "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            esc=$(tail -n 40 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | sed -z 's/\n/%0A/g')
            echo "::error title=linux-${f}::${esc}"
          done
